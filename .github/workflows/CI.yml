name: "amicone"

on:
  #schedule:
  #  - cron: "0 * * * *"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-files:
    name: "Run sync"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source repository"
        uses: actions/checkout@v7

      - name: "Install AM"
        run: |
          wget -q https://raw.githubusercontent.com/ivan-hc/AM/main/INSTALL && chmod a+x ./INSTALL && sudo ./INSTALL && rm ./INSTALL || exit 1

      - name: "Run AM install"
        run: |
          mkdir -p dist
          ARGS=$(cat missing-icons.txt | xargs)
          for a in $ARGS; do
            am -y -i "$a" | grep -i "installed"
            if [ -d /opt/"$a"/icons ] && [ -n "$(ls -A /opt/"$a"/icons)" ]; then
              mv /opt/"$a"/icons/* dist/
            fi
            am -R "$a"
          done
         
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Upload icons
          path: 'dist'



